
name: Profile Metrics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg

          # GitHub authentication
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""

          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: ${{ secrets.STEAM_USER_ID }}
          plugin_steam_sections: player
          plugin_steam_recent_games_limit: 3
          plugin_steam_achievements_limit: 0

          plugin_anilist: yes
          plugin_anilist_user: rainpaw
          plugin_anilist_medias: anime,manga
          plugin_anilist_sections: favorites,watching,reading,characters
          plugin_anilist_limit: 2
          plugin_anilist_limit_characters: 5
          plugin_anilist_shuffle: yes

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
